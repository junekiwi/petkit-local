name: tests

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag. `@v6` is a moving
# tag: whoever controls that repository can point it at new code, which then
# runs here — and `publish` runs with `packages: write`. That has happened in
# the wild. The trailing comment is the release each SHA belongs to; to update
# one, resolve the tag yourself rather than trusting the comment:
#
#   gh api repos/docker/build-push-action/commits/v6 --jq .sha

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: addon

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A 3.11-only breakage must not cancel the 3.12 job, and vice versa.
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml, 3.12 is what the
        # add-on image actually ships (Dockerfile: python:3.12-alpine on 64-bit).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # setup-python resolves this from the repo root, not from
          # defaults.run.working-directory.
          cache-dependency-path: |
            addon/requirements.txt
            addon/pyproject.toml
      - name: Install ffmpeg
        # The stitcher and video-thumbnail tests drive a real ffmpeg and skip
        # without one, and the runner image does not ship it. Those are the
        # tests guarding the one code path that deletes media (media/stitch.py).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        # requirements.txt is what the Docker image installs and pyproject.toml
        # is what a pip install resolves — install both so the two cannot drift
        # apart unnoticed. The dev extra brings pytest + pytest-asyncio.
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Import every module
        # The suite never imports some runtime-only modules (mqtt/broker.py is
        # one), so an ImportError there would otherwise reach a device instead
        # of failing CI.
        run: |
          python -c "
          import importlib, pkgutil, petkit_local
          for mod in pkgutil.walk_packages(petkit_local.__path__, 'petkit_local.'):
              importlib.import_module(mod.name)
          "
      - name: Run test suite
        run: pytest -q

  # The image has to BUILD on every architecture config.yaml advertises, and
  # nobody here owns 32-bit ARM hardware to find out on. Nothing else catches
  # this: the Python suite above passes happily while the image is unbuildable,
  # which is exactly what shipped — armv7 was listed as supported while
  # `cryptography` had no musllinux armv7 wheel, so it would have failed on
  # first install for every one of those users.
  #
  # QEMU makes it slow but it only has to be correct. armv7 is the whole point:
  # it takes the Debian branch of the Dockerfile and is the only arch that
  # compiles psutil and pyyaml from source.
  #
  # Pull requests only: on main the same three builds run in `publish.yml`, and
  # a failure there fails the push just as loudly. Running both would pay for
  # the slow one twice.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Emulation for the two ARM targets. Free on amd64, so not conditional.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      # TARGETARCH is a BuildKit built-in and the legacy builder leaves it
      # empty, so the per-arch base selection needs buildx to work at all.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the add-on image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          push: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Narrow on purpose (see [tool.ruff.lint] in pyproject.toml): a gate
      # against real defects, not a style enforcer. Four unused imports reached
      # main before this existed, because the only check anyone ran locally was
      # a pyflakes that turned out not to be installed.
      - name: Lint
        run: |
          pip install ruff
          ruff check petkit_local/ tests/
      # The panel's CSS/JS are prettier-formatted, and until now the only thing
      # enforcing that was a line in CLAUDE.md asking people to run it by hand.
      # No package.json needed — npx matches how it is run locally.
      - name: Check panel formatting
        run: npx prettier@3 --check petkit_local/web/static/js/*.js petkit_local/web/static/styles.css
