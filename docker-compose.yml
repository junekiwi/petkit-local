# Running petkit-local beside Home Assistant, without the add-on system.
#
# Add-ons need the Supervisor, so they exist only on Home Assistant OS and
# Home Assistant Supervised. If you run HA Container or HA Core you have no
# add-on store at all, and this file is that path: the same image, the same
# features, configured from the command line instead of an options screen.
#
#   docker compose up -d
#
# Two values are yours to set, and they live in `.env` rather than in this
# file — so they stay out of the repository and a `git pull` never conflicts
# with them. Compose refuses to start until both are there:
#
#   cp .env.example .env && $EDITOR .env
#
# Nothing else is required, though you will want the timezone in there too.

services:
  petkit-local:
    # Published by .github/workflows/publish.yml, and the same image the
    # Home Assistant app pulls. One multi-architecture package covering amd64,
    # arm64 and armv7, so Docker picks the right platform on its own — you do
    # not choose one.
    #
    #   :latest   the newest release
    #   :2.0.0    a release you pin, so nothing moves until you say so
    #   :dev      the last commit on main. Untested by definition; use it to try
    #             a fix before it ships, with `docker compose up -d --pull always`
    #             (a moving tag is cached by digest, so Compose will not refetch
    #             it on its own). To hold one exact build, use its digest:
    #             ghcr.io/junekiwi/petkit-local@sha256:...
    image: ghcr.io/junekiwi/petkit-local:latest
    #
    # To build it yourself instead — a local change, or an architecture nobody
    # publishes — comment out the line above and uncomment this, then
    # `docker compose up -d --build`. Needs BuildKit, which Compose uses by
    # default and Docker has used since 23; on a very old daemon export
    # DOCKER_BUILDKIT=1 first. The Dockerfile header explains why the
    # per-architecture base cannot fall back safely without it.
    # build: ./addon
    container_name: petkit-local
    restart: unless-stopped

    environment:
      # Your timezone, from `.env`. Days are cut at local midnight — Times
      # Used, the Timeline's "today" — and a container has no timezone of its
      # own, so without this it runs on UTC and starts each day hours early or
      # late. The add-on is given one by the Supervisor.
      - TZ=${TZ:-UTC}

    ports:
      # Device HTTP API.
      #
      # Host 80, and worth keeping there. An ESP32 model (T4, D4) provisioned
      # with any other port gets onto Wi-Fi and then fails at the server
      # connection — tested repeatedly on two devices — and one pointed here by
      # a DNS redirect dials 80 with nowhere to tell it otherwise. The
      # container still listens on 8080; only the host side moved. Ingenic
      # models take the port from the URL they are provisioned with, so for
      # those any host port works as long as --api-url below matches.
      - "80:8080"

      # Device MQTT over TLS. Not a choice: 443 is where the firmware looks.
      - "443:443"

      # Media uploads. The device PUTs its photos and video here.
      - "9000:9000"

      # The web panel. IT HAS NO AUTHENTICATION, and it can control your
      # devices, read the recordings and run the on-device patchers. Under the
      # add-on it is reached through Home Assistant Ingress, which does the
      # authenticating; there is no Ingress here.
      #
      # So decide deliberately:
      #   "127.0.0.1:8099:8099"  reachable only from this machine (safest; use
      #                          an SSH tunnel or put your own authenticating
      #                          proxy in front)
      #   "8099:8099"            reachable from anywhere on your network
      - "8099:8099"

      # Camera RTSP, served by the bundled go2rtc. This is the address to give
      # Home Assistant's Generic Camera — rtsp://THIS-HOST:8554/<device-id>,
      # and the panel shows the exact URL.
      #
      # Do NOT point Home Assistant at the device's own stream instead: HA opens
      # a stream URL with PyAV and the device's FLV segfaults libav, restarting
      # the whole of Home Assistant. go2rtc exists here to stand between them.
      #
      # Under the add-on this port is not published at all, because Home
      # Assistant can reach add-ons by hostname on its internal network. There
      # is no such network here, hence the mapping. If you also run the go2rtc
      # add-on or container, give this a different host port — 8554 is theirs.
      - "8554:8554"

      # 1883 (plain MQTT) is deliberately NOT published. It is the internal
      # listener the bridge uses, and publishing it would clash with a broker
      # you already run.

    volumes:
      # Device identities, settings, the event database and captures.
      - ./data:/data
      # Recordings and snapshots. Point this at your Home Assistant media
      # directory to browse them from HA, or leave it local.
      - ./media:/media/petkit

    command:
      - python3
      - -m
      - petkit_local.main
      - --data-dir=/data
      # The address the DEVICE will call, and the most important value in
      # this setup — see `.env.example` for what it has to be. The port in it
      # must match the host side of the mapping above.
      #
      # Three things are derived from it, so a wrong value fails in three
      # places: the API address itself, the MQTT broker the device is told to
      # connect to, and the bucket it uploads photos and video to. Leave the
      # host out and there is nothing to derive them from — media uploads in
      # particular then have nowhere to go, and the add-on says so at startup.
      - --api-url=${PETKIT_API_URL:?not set. Copy .env.example to .env and fill it in.}
      # Optional: override the derived https://<api-host>:9000 media upload URL.
      # Use this when devices must upload through a different hostname, port or
      # TLS-terminating proxy than the API host.
      # - --bucket-endpoint=https://CHANGE-ME:9000
      - --port=8080
      - --mqtt-tls
      - --mqtt-tls-port=443
      # Your Home Assistant MQTT broker, so entities appear via MQTT discovery.
      # Drop these two lines (or pass --no-ha) to run with no Home Assistant at
      # all: the web panel and the local cloud work regardless.
      - --ha-mqtt-host=${PETKIT_HA_MQTT_HOST:?not set. Put it in .env, or delete this line to run without Home Assistant.}
      - --ha-mqtt-port=1883
      # Uncomment if your broker requires credentials.
      # - --ha-mqtt-user=petkit
      # - --ha-mqtt-pass=secret
